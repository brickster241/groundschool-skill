<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 240" font-family="IBM Plex Mono, ui-monospace, monospace">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6675"/>
    </marker>
    <marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffb454"/>
    </marker>
  </defs>

  <!-- EXAMPLE diagram: demonstrates the night-cockpit diagram language.
       Boxes #11151D on #232B38 hairlines; amber = the main flow; hud blue =
       data/labels; dim text #8b98a9; mono type. Author real ones from the code. -->

  <rect x="30" y="70" width="200" height="90" rx="10" fill="#11151d" stroke="#232b38" stroke-width="1.5"/>
  <text x="130" y="102" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Input</text>
  <text x="130" y="124" text-anchor="middle" fill="#8b98a9" font-size="11">where work enters</text>
  <text x="130" y="141" text-anchor="middle" fill="#7dd3fc" font-size="10">src/main.ts</text>

  <rect x="330" y="70" width="200" height="90" rx="10" fill="#11151d" stroke="#ffb454" stroke-width="1.5"/>
  <text x="430" y="102" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Core</text>
  <text x="430" y="124" text-anchor="middle" fill="#8b98a9" font-size="11">the transformation</text>
  <text x="430" y="141" text-anchor="middle" fill="#7dd3fc" font-size="10">src/core/</text>

  <rect x="630" y="70" width="200" height="90" rx="10" fill="#11151d" stroke="#232b38" stroke-width="1.5"/>
  <text x="730" y="102" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Output</text>
  <text x="730" y="124" text-anchor="middle" fill="#8b98a9" font-size="11">what leaves</text>
  <text x="730" y="141" text-anchor="middle" fill="#7dd3fc" font-size="10">src/output/</text>

  <line x1="230" y1="115" x2="322" y2="115" stroke="#ffb454" stroke-width="1.8" marker-end="url(#arA)"/>
  <line x1="530" y1="115" x2="622" y2="115" stroke="#ffb454" stroke-width="1.8" marker-end="url(#arA)"/>

  <line x1="730" y1="160" x2="730" y2="200" stroke="#5b6675" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ar)"/>
  <text x="748" y="188" fill="#5b6675" font-size="10">feedback / telemetry (dashed = return path)</text>
</svg>
